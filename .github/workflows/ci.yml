name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate content JSON
        run: python scripts/validate_content.py
      - name: Agent skills are in sync
        run: python scripts/sync_skills.py --check
      - name: Engine does not reference skins or ui
        run: python scripts/check_engine_boundaries.py
      - name: No em-dashes in docs
        run: |
          if grep -rn $'\xe2\x80\x94' --include="*.md" . ; then
            echo "Found em-dashes. Please rewrite those sentences."; exit 1
          fi
      - name: GDScript lint and format
        run: |
          files=$(find game -name "*.gd" -not -path "game/addons/*" 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No GDScript files yet."; exit 0; fi
          pip install "gdtoolkit==4.*"
          gdlint $files
          gdformat --check $files

  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        if: ${{ hashFiles('tracker/pyproject.toml') != '' }}
        working-directory: tracker
        run: pip install -e ".[dev]"
      - name: Lint
        if: ${{ hashFiles('tracker/pyproject.toml') != '' }}
        working-directory: tracker
        run: ruff check .
      - name: Test
        if: ${{ hashFiles('tracker/pyproject.toml') != '' }}
        working-directory: tracker
        run: python -m pytest

  godot-tests:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the version on both laptops. Upgrading Godot is a team decision.
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version
      - name: Import the project
        # Builds Godot's cache (game/.godot) so scripts and addons are known before tests run.
        run: ./godot --headless --path game --import
      - name: Run GUT tests
        run: ./godot --headless --path game -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit
