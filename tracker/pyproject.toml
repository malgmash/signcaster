[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signtracker"
dynamic = ["version"]
description = "Hand tracking sidecar for Signcaster. Sends letters to the game over localhost UDP."
requires-python = ">=3.11"
# No opencv-python: MediaPipe already installs opencv-contrib-python, and two packages that
# both provide the cv2 module overwrite each other's files.
dependencies = [
  "mediapipe",
  "numpy",
]

[project.optional-dependencies]
# Only tools/train.py needs scikit-learn. The tracker itself predicts with numpy from
# models/letters.npz, so players never need it (and the M12 download stays small).
train = [
  "scikit-learn",
]
dev = [
  "signtracker[train]",
  "pytest",
  "ruff",
]

[tool.setuptools.dynamic]
version = { attr = "signtracker.__version__" }

[tool.setuptools.packages.find]
include = ["signtracker*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
